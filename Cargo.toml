[package]
name = "xlm-vanity"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Offline Stellar Ed25519 vanity account generator"
readme = "README.md"

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
# argon2 0.5.3 wipes its Blake2 state when `zeroize` is on, but it does not
# enable generic-array's `zeroize` feature. The direct feature turns on
# `GenericArray::zeroize` so that wipe compiles.
generic-array = { version = "=0.14.7", features = ["zeroize"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std", "zeroize", "fast"] }
getrandom = "0.2"
ring = "0.17"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stellar-strkey = "=0.0.18"
thiserror = "2"
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
name = "xlm_vanity"
path = "src/lib.rs"

[[bin]]
name = "xlm-vanity"
path = "src/main.rs"

[[bench]]
name = "derive"
harness = false
